<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Portfolio Builder</h1>
        <p>Monte sua carteira de investimentos.</p>
    </div>

    <form id="formulario-carteira">
        <label for="capital-inicial">Capital inicial</label>
        <input id="capital-inicial" type="number" min="0" step="0.01" placeholder="1000,00">

        <label for="aporte-mensal">Aporte mensal</label>
        <input id="aporte-mensal" type="number" min="0" step="0.01" placeholder="500,00">

        <label for="periodo">Período</label>
        <select id="periodo">
            <option value="3">3 anos</option>
            <option value="5">5 anos</option>
            <option value="7">7 anos</option>
            <option value="10">10 anos</option>
            <option value="MAX">Máximo disponível</option>
        </select>

      

        <label for="busca-ativo">Buscar ticker</label>

        <input
            id="busca-ativo"
            type="search"
            placeholder="Digite o ticker, exemplo: MSFT">

        <div id="sugestoes-ativos"></div>

        <fieldset class="lista-ativos">
            <legend>Ativos da carteira</legend>
        </fieldset>

        <button id="press" type="submit">Simular</button>
    </form>

    <section id="resultado">
        <div id = "resultado-texto">   
            <div id="resultado-texto-1"></div>
        </div>

        

        <canvas id="grafico-investimentos"></canvas>
    </section>

    <script src="UI.js"></script>
    <script src="InfoRsults.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="MainChart.js"></script>
</body>
</html>
