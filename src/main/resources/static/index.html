<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Portfolio Builder</h1>
        <p>Monte sua carteira de investimentos.</p>
    </div>

    <form id="formulario-carteira">
        <label for="capital-inicial">Capital inicial</label>
        <input id="capital-inicial" type="number" min="0" step="0.01" placeholder="1000,00">

        <label for="aporte-mensal">Aporte mensal</label>
        <input id="aporte-mensal" type="number" min="0" step="0.01" placeholder="500,00">

        <label for="periodo">Período em anos</label>
        <input id="periodo" type="number" min="1" placeholder="5">

        <fieldset class="lista-ativos">
            <legend>Ativos da carteira</legend>

            <label class="ativo">
                <input type="checkbox" name="ativos" value="AAPL">
                <span>Apple (AAPL)</span>
                <input type="number" name="percentuais" min="0" max="100" step="0.01" placeholder="%">
            </label>

            <label class="ativo">
                <input type="checkbox" name="ativos" value="MSFT">
                <span>Microsoft (MSFT)</span>
                <input type="number" name="percentuais" min="0" max="100" step="0.01" placeholder="%">
            </label>

            <label class="ativo">
                <input type="checkbox" name="ativos" value="AMZN">
                <span>Amazon (AMZN)</span>
                <input type="number" name="percentuais" min="0" max="100" step="0.01" placeholder="%">
            </label>

            <label class="ativo">
                <input type="checkbox" name="ativos" value="GOOGL">
                <span>Alphabet (GOOGL)</span>
                <input type="number" name="percentuais" min="0" max="100" step="0.01" placeholder="%">
            </label>

        
        </fieldset>

        <button id="press" type="submit">Simular</button>
    </form>

    <section id="resultado">
        <canvas id="grafico-investimentos"></canvas>
    </section>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="MainChart.js"></script>
</body>
</html>
