server.port=8081

# Configurações do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:investimentosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Habilita o Console Web do H2 (http://localhost:8081/h2-console)
spring.h2.console.enabled=true

# Configurações da API Twelve Data
twelve-data.api-key=${DB_TWELVEDATAKEY}
twelve-data.base-url=https://api.twelvedata.com